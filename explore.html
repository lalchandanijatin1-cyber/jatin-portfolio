<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore — Jatin Lalchandani</title>

    <link rel="stylesheet" href="/src/explore/style.css">
</head>

<body>

    <main id="explore">

        <!-- =========================================
             BACKGROUND VIDEO
        ========================================== -->
        <video
            id="explore-video"
            class="explore-video"
            autoplay
            muted
            loop
            playsinline
        >
            <source
                src="/explore/background/explore-background.mp4"
                type="video/mp4"
            >
        </video>

        <div class="explore-overlay"></div>

        <div class="explore-panel-wrap">

            <!-- Previous Tab -->
            <button
                class="side-arrow side-arrow-left"
                id="tab-prev"
                aria-label="Previous tab"
            >
                [
            </button>

            <section class="explore-panel">

                <!-- =========================================
                     FIXED TAB BAR
                     Projects → Skills → Services
                     Heading position stays intact
                ========================================== -->
                <div class="tab-bar" role="tablist">

                    <button
                        class="tab-btn"
                        data-tab="projects"
                        role="tab"
                        aria-selected="false"
                    >
                        <span class="tab-label">Projects</span>
                    </button>

                    <button
                        class="tab-btn"
                        data-tab="skills"
                        role="tab"
                        aria-selected="false"
                    >
                        <span class="tab-label">Skills</span>
                    </button>

                    <button
                        class="tab-btn"
                        data-tab="services"
                        role="tab"
                        aria-selected="false"
                    >
                        <span class="tab-label">Services</span>
                    </button>

                    <!-- Close -->
                    <button
                        class="tab-btn tab-close"
                        id="close-tab"
                        aria-label="Close and return to Home"
                    >
                        &#10005;
                    </button>

                </div>

                <!-- =========================================
                     PANEL BODY
                     Only content below the headings changes
                ========================================== -->
                <div class="panel-body">

                    <!-- =====================================
                         ACTIONS
                    ====================================== -->
                    <div class="action-row">

                        <!-- Opens email draft through index.js -->
                        <button
                            class="action-btn"
                            id="build-with-me-btn"
                        >
                            Build With Me
                        </button>

                        <button
                            class="action-btn"
                            id="connect-with-me-btn"
                        >
                            Connect With Me
                        </button>

                        <button
                            class="action-btn action-btn-icon"
                            id="back-to-home-btn"
                            aria-label="Back to Home"
                        >
                            &#8617;
                        </button>

                    </div>

                    <!-- =====================================
                         DYNAMIC CONTENT
                         Projects / Skills / Services content
                         comes out from here.

                         The tab-bar above remains fixed.
                    ====================================== -->
                    <div
                        class="panel-content"
                        id="panel-content"
                    ></div>

                </div>

            </section>

            <!-- Next Tab -->
            <button
                class="side-arrow side-arrow-right"
                id="tab-next"
                aria-label="Next tab"
            >
                ]
            </button>

        </div>

    </main>


    <!-- =========================================
         GLOBAL PORTFOLIO MUSIC
    ========================================== -->
    <script
        type="module"
        src="/src/music/music.js"
    ></script>


    <script
        type="module"
        src="/src/explore/index.js"
    ></script>

</body>
</html>
