<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jatin Lalchandani</title>

    <!-- Explore image-rain transition -->
    <link rel="stylesheet" href="/src/explore/transition.css">

    <!-- Minecraft-style block wipe transition -->
    <link rel="stylesheet" href="/src/transitions/block-wipe/block-wipe.css">

    <!-- Home styles -->
    <link rel="stylesheet" href="/src/home/style.css">
</head>

<body>

    <!-- =========================================
         EXPLORE IMAGE-RAIN TRANSITION
         Used only when EXPLORE is clicked.
    ========================================== -->
    <div id="world-transition-overlay"></div>


    <!-- =========================================
         BLOCK WIPE TRANSITION
         Used for:
         PROJECTS
         SKILLS
         EXPERIENCE
         HOBBIES
         OTHERS
         WORLD
    ========================================== -->
    <div id="block-wipe-overlay"></div>


    <main id="home">

        <!-- =========================================
             BACKGROUND VIDEO
        ========================================== -->
        <video
            id="home-video"
            class="home-video"
            autoplay
            muted
            loop
            playsinline
        >
            <source
                src="/home/background/home-background.mp4"
                type="video/mp4"
            >
        </video>


        <!-- Dark overlay so menu stays readable over the video -->
        <div class="home-overlay"></div>


        <!-- =========================================
             JATIN LALCHANDANI LOGO
        ========================================== -->
        <div class="home-logo-wrap">

            <img
                src="/home/logo/jatin-lalchandani.png"
                alt="Jatin Lalchandani"
                class="home-logo"
            >

        </div>


        <!-- =========================================
             MAIN MENU
        ========================================== -->
        <nav class="home-menu" aria-label="Main menu">

            <button
                class="menu-btn"
                data-target="explore"
            >
                EXPLORE
            </button>


            <button
                class="menu-btn"
                data-target="projects"
            >
                PROJECTS
            </button>


            <button
                class="menu-btn"
                data-target="skills"
            >
                SKILLS
            </button>


            <button
                class="menu-btn"
                data-target="experience"
            >
                EXPERIENCE
            </button>


            <div class="menu-row">

                <!-- =========================================
                     WORLD ICON
                ========================================== -->
                <button
                    class="icon-btn world-icon-btn"
                    data-target="hobbies-icon"
                    aria-label="World"
                >
                    <img
                        src="/home/icons/world.png"
                        alt=""
                    >
                </button>


                <button
                    class="menu-btn menu-btn-half"
                    data-target="hobbies"
                >
                    HOBBIES
                </button>


                <button
                    class="menu-btn menu-btn-half"
                    data-target="others"
                >
                    OTHERS
                </button>

            </div>

        </nav>


        <!-- =========================================
             SOCIAL ICONS
        ========================================== -->
        <div class="home-socials">

            <a
                href="https://www.linkedin.com/in/jatin-lalchandani-robotics/"
                target="_blank"
                rel="noopener noreferrer"
                class="social-icon"
                aria-label="LinkedIn"
            >
                <img
                    src="/home/icons/linkedin.png"
                    alt="LinkedIn"
                >
            </a>


            <a
                href="https://github.com/lalchandanijatin1-cyber"
                target="_blank"
                rel="noopener noreferrer"
                class="social-icon"
                aria-label="GitHub"
            >
                <img
                    src="/home/icons/github.png"
                    alt="GitHub"
                >
            </a>

        </div>

    </main>


    <!-- Home controller -->
    <script
        type="module"
        src="/src/home/index.js"
    ></script>

</body>
</html>
