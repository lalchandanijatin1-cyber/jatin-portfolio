<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Jatin Lalchandani — an interactive voxel-world portfolio." />
  <title>Jatin Lalchandani — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div id="app">
    <!-- Fullscreen WebGL canvas target -->
    <canvas id="scene-canvas"></canvas>

    <!-- Opening / intro overlay -->
    <div id="intro-layer" aria-hidden="false">
      <div id="intro-veil"></div>
      <div id="intro-frame">
        <span class="corner corner-tl" aria-hidden="true"></span>
        <span class="corner corner-tr" aria-hidden="true"></span>
        <span class="corner corner-bl" aria-hidden="true"></span>
        <span class="corner corner-br" aria-hidden="true"></span>

        <h1 id="intro-title" class="scramble-title"></h1>

        <div id="intro-loading" aria-hidden="true">
          <div id="intro-loading-fill"></div>
        </div>
      </div>
    </div>

    <!-- Home / main-menu UI overlay -->
    <div id="home-layer" aria-hidden="true"></div>

    <!-- Screen-reader / accessibility live region for transitions -->
    <div id="a11y-status" class="sr-only" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
