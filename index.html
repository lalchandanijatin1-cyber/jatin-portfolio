```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="Jatin Lalchandani — an interactive 3D voxel-world portfolio."
  />

  <title>Jatin Lalchandani — Portfolio</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
</head>

<body>

  <div id="app">

    <!--
      Three.js renders the entire 3D voxel world
      inside this canvas.
    -->
    <canvas id="scene-canvas"></canvas>


    <!-- ==================================================
         OPENING / INTRO
         ================================================== -->

    <div id="intro-layer" aria-hidden="false">

      <!-- Dark veil covering the 3D world -->
      <div id="intro-veil"></div>


      <!-- Intro content -->
      <div id="intro-frame">

        <!-- Decorative corner brackets -->
        <span class="corner corner-tl" aria-hidden="true"></span>
        <span class="corner corner-tr" aria-hidden="true"></span>
        <span class="corner corner-bl" aria-hidden="true"></span>
        <span class="corner corner-br" aria-hidden="true"></span>


        <!-- Main name -->
        <h1
          id="intro-title"
          class="scramble-title"
          aria-label="Jatin Lalchandani"
        ></h1>


        <!-- Welcome message -->
        <p id="intro-subtitle">
          Welcome to my world
        </p>


        <!-- Loading line -->
        <div id="intro-loading" aria-hidden="true">
          <div id="intro-loading-fill"></div>
        </div>

      </div>

    </div>


    <!-- ==================================================
         HOME / MAIN MENU
         This will be populated later using JavaScript.
         ================================================== -->

    <div
      id="home-layer"
      aria-hidden="true"
    ></div>


    <!-- Accessibility announcements -->
    <div
      id="a11y-status"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></div>

  </div>


  <!-- Main JavaScript entry point -->
  <script
    type="module"
    src="/src/main.js"
  ></script>

</body>
</html>
```
