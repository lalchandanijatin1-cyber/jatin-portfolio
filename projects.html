<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects — Jatin Lalchandani</title>

    <link
        rel="stylesheet"
        href="/src/transitions/block-wipe/block-wipe.css"
    >

    <link
        rel="stylesheet"
        href="/src/projects/style.css"
    >
</head>

<body>

    <!-- =========================================
         BLOCK WIPE TRANSITION
    ========================================== -->
    <div
        id="block-wipe-overlay"
        class="block-wipe-active block-wipe-covered"
    ></div>


    <!-- =========================================
         PROJECTS PAGE
    ========================================== -->
    <main id="projects">

        <!-- Background video stays throughout
             every Projects screen -->
        <video
            id="projects-video"
            class="projects-video"
            autoplay
            muted
            loop
            playsinline
        >
            <source
                src="/projects/background/projects-background.mp4"
                type="video/mp4"
            >
        </video>

        <div class="projects-overlay"></div>


        <!-- =========================================
             TOP BAR
        ========================================== -->
        <header class="projects-header">

            <button
                id="close-to-home-btn"
                class="close-to-home-btn"
                aria-label="Back to Home"
            >
                ×
            </button>

            <div class="projects-header-title">
                PROJECTS
            </div>

        </header>


        <!-- =========================================
             CATEGORY VIEW
        ========================================== -->
        <section
            id="category-view"
            class="projects-screen active-screen"
        >

            <div class="projects-title-wrap">
                <img
                    src="/projects/logo/projects.png"
                    alt="Projects"
                    class="projects-logo"
                >
            </div>

            <div
                id="category-grid"
                class="category-grid"
            ></div>

            <a
                class="all-projects-github"
                href="https://github.com/lalchandanijatin1-cyber"
                target="_blank"
                rel="noopener noreferrer"
            >
                VIEW ALL PROJECTS ON GITHUB
            </a>

        </section>


        <!-- =========================================
             PROJECT LIST VIEW
        ========================================== -->
        <section
            id="project-list-view"
            class="projects-screen"
        >

            <button
                id="back-to-categories-btn"
                class="minecraft-back-btn"
            >
                ← BACK TO CATEGORIES
            </button>

            <h1
                id="category-title"
                class="section-title"
            >
                ROBOTICS & HARDWARE
            </h1>

            <div
                id="project-grid"
                class="project-grid"
            ></div>

        </section>


        <!-- =========================================
             PROJECT DETAIL VIEW
        ========================================== -->
        <section
            id="project-detail-view"
            class="projects-screen"
        >

            <button
                id="back-to-projects-btn"
                class="minecraft-back-btn"
            >
                ← BACK TO PROJECTS
            </button>

            <div class="detail-panel">

                <div class="detail-heading-row">

                    <div>
                        <div class="detail-small-title">
                            PROJECT
                        </div>

                        <h1
                            id="detail-project-name"
                            class="detail-project-name"
                        >
                            PROJECT NAME
                        </h1>
                    </div>

                    <div
                        id="detail-status"
                        class="detail-status"
                    ></div>

                </div>


                <div class="detail-main">

                    <!-- LEFT -->
                    <div class="detail-left">

                        <div class="detail-image-frame">

                            <img
                                id="detail-project-image"
                                src=""
                                alt=""
                            >

                            <div
                                id="detail-image-placeholder"
                                class="detail-image-placeholder"
                            >
                                PROJECT
                            </div>

                        </div>

                        <div class="detail-skills-title">
                            ALL SKILLS
                        </div>

                        <div
                            id="detail-all-skills"
                            class="detail-skills"
                        ></div>

                    </div>


                    <!-- RIGHT -->
                    <div class="detail-right">

                        <div class="detail-field">

                            <div class="detail-label">
                                PROJECT NAME
                            </div>

                            <div
                                id="detail-name-value"
                                class="detail-value"
                            ></div>

                        </div>


                        <div class="detail-field">

                            <div class="detail-label">
                                SHORT DESCRIPTION
                            </div>

                            <p
                                id="detail-description"
                                class="detail-description"
                            ></p>

                        </div>


                        <div class="detail-field">

                            <div class="detail-label">
                                TOP SKILLS
                            </div>

                            <div
                                id="detail-top-skills"
                                class="top-skills"
                            ></div>

                        </div>


                        <div
                            id="detail-links-section"
                            class="detail-field"
                        >

                            <div class="detail-label">
                                LINKS
                            </div>

                            <div class="detail-links">

                                <button
                                    id="detail-github-btn"
                                    class="detail-link-btn"
                                >
                                    GITHUB
                                </button>

                                <button
                                    id="detail-demo-btn"
                                    class="detail-link-btn"
                                >
                                    LIVE DEMO
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================================
             COMING SOON VIEW
             Used for projects/categories without
             complete data yet.
        ========================================== -->
        <section
            id="coming-soon-view"
            class="projects-screen"
        >

            <button
                id="back-from-coming-soon-btn"
                class="minecraft-back-btn"
            >
                ← BACK
            </button>

            <div class="coming-soon-panel">

                <div class="coming-soon-icon">
                    ⚒
                </div>

                <h1>
                    COMING SOON
                </h1>

                <p id="coming-soon-name">
                    MORE INFORMATION WILL BE ADDED SOON.
                </p>

            </div>

        </section>

    </main>


    <!-- Projects controller -->
    <script
        type="module"
        src="/src/projects/index.js"
    ></script>


    <!-- Block wipe controller -->
    <script type="module">

        import {
            BlockWipeTransition
        } from '/src/transitions/block-wipe/BlockWipeTransition.js';

        BlockWipeTransition.revealIn();

    </script>

</body>
</html>
