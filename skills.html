<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skills — Jatin Lalchandani</title>

    <!-- =========================================
         BLOCK WIPE TRANSITION
    ========================================== -->
    <link
        rel="stylesheet"
        href="/src/transitions/block-wipe/block-wipe.css"
    >

    <!-- =========================================
         SKILLS STYLES
    ========================================== -->
    <link
        rel="stylesheet"
        href="/src/skills/style.css"
    >
</head>

<body>

    <!-- =========================================
         BLOCK WIPE TRANSITION
    ========================================== -->
    <div
        id="block-wipe-overlay"
        class="block-wipe-active block-wipe-covered"
    ></div>


    <!-- =========================================
         SKILLS PAGE
    ========================================== -->
    <main id="skills">

        <!-- =========================================
             BACKGROUND VIDEO
             Stays throughout every Skills screen
        ========================================== -->
        <video
            id="skills-video"
            class="skills-video"
            autoplay
            muted
            loop
            playsinline
        >
            <source
                src="/skills/background/skills-background.mp4"
                type="video/mp4"
            >
        </video>

        <div class="skills-overlay"></div>


        <!-- =========================================
             TOP BAR
        ========================================== -->
        <header class="skills-header">

            <button
                id="close-to-home-btn"
                class="close-to-home-btn"
                aria-label="Back to Home"
            >
                ×
            </button>

        </header>


        <!-- =========================================
             CATEGORY VIEW
        ========================================== -->
        <section
            id="skill-category-view"
            class="skills-screen active-screen"
        >

            <!-- Skills heading image -->
            <div class="skills-title-wrap">

                <img
                    src="/skills/logo/skills.png"
                    alt="Skills"
                    class="skills-logo"
                >

            </div>


            <!-- Categories generated by data.js -->
            <div
                id="skill-category-grid"
                class="skill-category-grid"
            ></div>

        </section>


        <!-- =========================================
             SKILL LIST VIEW
        ========================================== -->
        <section
            id="skill-list-view"
            class="skills-screen"
        >

            <button
                id="back-to-skills-btn"
                class="minecraft-back-btn"
            >
                ← BACK TO SKILLS
            </button>


            <h1
                id="skill-category-title"
                class="section-title"
            >
                AI / ML
            </h1>


            <div
                id="skill-grid"
                class="skill-grid"
            ></div>

        </section>


        <!-- =========================================
             SKILL DETAIL VIEW
        ========================================== -->
        <section
            id="skill-detail-view"
            class="skills-screen"
        >

            <button
                id="back-to-skill-list-btn"
                class="minecraft-back-btn"
            >
                ← BACK TO SKILLS
            </button>


            <div class="skill-detail-panel">

                <!-- =================================
                     DETAIL HEADING
                ================================== -->
                <div class="skill-detail-heading-row">

                    <div>

                        <div class="skill-detail-small-title">
                            SKILL
                        </div>

                        <h1
                            id="detail-skill-name"
                            class="detail-skill-name"
                        >
                            SKILL NAME
                        </h1>

                    </div>


                    <!-- Green / Red status -->
                    <div
                        id="detail-skill-status"
                        class="detail-skill-status"
                    ></div>

                </div>


                <!-- =================================
                     DETAIL MAIN
                ================================== -->
                <div class="skill-detail-main">


                    <!-- LEFT -->
                    <div class="skill-detail-left">

                        <div class="skill-detail-image-frame">

                            <img
                                id="detail-skill-image"
                                src=""
                                alt=""
                            >

                            <div
                                id="detail-skill-image-placeholder"
                                class="detail-skill-image-placeholder"
                            >
                                SKILL
                            </div>

                        </div>

                    </div>


                    <!-- RIGHT -->
                    <div class="skill-detail-right">


                        <!-- Skill name -->
                        <div class="skill-detail-field">

                            <div class="skill-detail-label">
                                SKILL NAME
                            </div>

                            <div
                                id="detail-skill-name-value"
                                class="skill-detail-value"
                            ></div>

                        </div>


                        <!-- Description -->
                        <div class="skill-detail-field">

                            <div class="skill-detail-label">
                                DESCRIPTION
                            </div>

                            <p
                                id="detail-skill-description"
                                class="skill-detail-description"
                            ></p>

                        </div>


                        <!-- Status -->
                        <div class="skill-detail-field">

                            <div class="skill-detail-label">
                                LEVEL
                            </div>

                            <div
                                id="detail-skill-level"
                                class="skill-detail-level"
                            ></div>

                        </div>


                        <!-- Related technologies -->
                        <div class="skill-detail-field">

                            <div class="skill-detail-label">
                                RELATED SKILLS
                            </div>

                            <div
                                id="detail-related-skills"
                                class="detail-related-skills"
                            ></div>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================================
             COMING SOON VIEW
             Mainly useful for future categories
        ========================================== -->
        <section
            id="skill-coming-soon-view"
            class="skills-screen"
        >

            <button
                id="back-from-skill-coming-soon-btn"
                class="minecraft-back-btn"
            >
                ← BACK
            </button>


            <div class="skill-coming-soon-panel">

                <div class="skill-coming-soon-icon">
                    ⚒
                </div>

                <h1>
                    COMING SOON
                </h1>

                <p id="skill-coming-soon-name">
                    MORE INFORMATION WILL BE ADDED SOON.
                </p>

            </div>

        </section>

    </main>


    <!-- =========================================
         GLOBAL PORTFOLIO MUSIC
    ========================================== -->
    <script
        type="module"
        src="/src/music/music.js"
    ></script>


    <!-- =========================================
         SKILLS CONTROLLER
    ========================================== -->
    <script
        type="module"
        src="/src/skills/index.js"
    ></script>


    <!-- =========================================
         BLOCK WIPE CONTROLLER
    ========================================== -->
    <script type="module">

        import {
            BlockWipeTransition
        } from '/src/transitions/block-wipe/BlockWipeTransition.js';

        BlockWipeTransition.revealIn();

    </script>

</body>
</html>
